name: Frontend Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web apps
        run: pnpm build
        env:
          VITE_ADMIN_URL: /admin/
          VITE_LANDING_URL: /
          VITE_API_BASE: ${{ vars.VITE_API_BASE || '/api/v1' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_DOCS_URL: ${{ vars.VITE_DOCS_URL }}
          VITE_CHROME_STORE_URL: ${{ vars.VITE_CHROME_STORE_URL }}

      - name: Deploy to Nginx server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing DEPLOY_PATH secret"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/landing-page' '$DEPLOY_PATH/admin-page'"
          rsync -az --delete landing-page/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/landing-page/"
          rsync -az --delete admin-page/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/admin-page/"

      - name: Upload landing page
        uses: actions/upload-artifact@v4
        with:
          name: landing-page
          path: landing-page/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload admin page
        uses: actions/upload-artifact@v4
        with:
          name: admin-page
          path: admin-page/dist/
          if-no-files-found: error
          retention-days: 7
